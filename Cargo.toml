[package]
name = "bposit-calc"
version = "0.1.0"
edition = "2021"
description = "An HP-48 style RPN calculator for bounded posits, with a bit-level view of the encoding"
license = "LGPL-3.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fast-posit = "0.2.0"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
